[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/protocol",
    "crates/engine",
    "crates/cli",
]
exclude = [".tmp/**"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rebuildup/procon-2026"
publish = false

[workspace.dependencies]
# Internal
domain = { path = "crates/domain" }
protocol = { path = "crates/protocol" }
engine = { path = "crates/engine" }

# Serialization (core ↔ frontend wire format)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / observability (CLI / engine)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime (engine server / protocol)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Lints aggregation
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"

# Profile tuned for contest solver responsiveness
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev]
opt-level = 1
debug = 1
incremental = true
