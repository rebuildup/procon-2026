[package]
name = "protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Wire format between the Rust core and the SolidJS frontend (JSON v1)."

[lints]
workspace = true

[dependencies]
domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Only used to hand a buffered body back to the decoders when an
# `HttpObserver` is attached (Issue #396); already in the tree via reqwest.
http = "1"

[dev-dependencies]
proptest = "1"
mockito = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }