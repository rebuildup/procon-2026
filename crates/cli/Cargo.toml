[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Operator CLI: replay runner, smoke harness, transport adapters."

[lints]
workspace = true

[[bin]]
name = "procon"
path = "src/main.rs"

[dependencies]
domain = { workspace = true }
protocol = { workspace = true }
engine = { workspace = true }
solver-loop = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
zip = { workspace = true }
regex = "1"

[dev-dependencies]
tempfile = "3"
mockito = "1"
# Real-HTTP-server E2E harness (`crates/cli/tests/e2e_real_server.rs`).
# Bound to a real axum server on 127.0.0.1:<random> so we exercise the
# full `reqwest` -> `tokio` -> `axum::serve` -> router pipeline instead
# of the in-process mockito path covered by `e2e_openapi_fixture.rs`.
axum = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
