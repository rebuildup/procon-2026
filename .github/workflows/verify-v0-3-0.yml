name: v0.3.0 release gate
on:
  push:
    branches: ['release-0-3-0']
    paths:
      - 'crates/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install just and frontend dependencies
        run: |
          cargo install just --locked
          (cd packages/frontend && bun install --frozen-lockfile)
      - name: Full release gate
        run: just release-check release-0-3-0
