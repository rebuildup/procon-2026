name: Sync research subtree to team PR

on:
  workflow_dispatch:
    inputs:
      approve_full_copy:
        type: boolean
        required: true
        default: false
        description: "Confirm all tracked files (including PDF/ZIP/media) may be copied to the private team repository"
      expected_source_sha:
        type: string
        required: false
        default: ""
        description: "Optional exact source main SHA (abort if it has changed)"
      team_branch:
        type: string
        required: true
        default: "link-personal-research"
        description: "Existing team PR branch (link-personal-research or sync-research-YYYYMMDD)"

permissions:
  contents: read

concurrency:
  group: sync-research-subtree-to-team
  cancel-in-progress: false

jobs:
  import:
    if: ${{ inputs.approve_full_copy == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Mint team-scoped GitHub App token (preferred)
        if: ${{ vars.PROCON_TEAM_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        id: team_app
        with:
          client-id: ${{ vars.PROCON_TEAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROCON_TEAM_APP_PRIVATE_KEY }}
          owner: cslab-nituc
          repositories: procon2026
          permission-contents: write

      - name: Require limited team write credential
        env:
          TEAM_TOKEN: ${{ steps.team_app.outputs.token || secrets.PROCON_TEAM_WRITE_TOKEN }}
        run: |
          if [[ -z "${TEAM_TOKEN}" ]]; then
            echo "::error::Configure PROCON_TEAM_APP_CLIENT_ID and PROCON_TEAM_APP_PRIVATE_KEY for a team-installed GitHub App, or PROCON_TEAM_WRITE_TOKEN as a fallback."
            exit 1
          fi

      - name: Checkout personal source main
        uses: actions/checkout@v4
        with:
          path: source
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout existing team PR branch
        uses: actions/checkout@v4
        with:
          repository: cslab-nituc/procon2026
          ref: ${{ inputs.team_branch }}
          path: team
          fetch-depth: 0
          token: ${{ steps.team_app.outputs.token || secrets.PROCON_TEAM_WRITE_TOKEN }}
          persist-credentials: true

      - name: Validate source and destination before copying
        id: preflight
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          TARGET_BRANCH: ${{ inputs.team_branch }}
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          tree="$(git -C source rev-parse 'HEAD^{tree}')"
          head="$(git -C team rev-parse HEAD)"
          if [[ -n "${EXPECTED_SOURCE_SHA}" && "${EXPECTED_SOURCE_SHA}" != "${sha}" ]]; then
            echo "::error::Source main advanced; expected ${EXPECTED_SOURCE_SHA}, got ${sha}"
            exit 1
          fi
          if git -C source ls-files | grep -Ei '(^|/)(\.env$|id_rsa$|id_ed25519$|[^/]+\.(pem|p12|pfx|key)$)'; then
            echo "::error::Tracked credential-like filenames detected. Review source before copying."
            exit 1
          fi
          if [[ "${TARGET_BRANCH}" != "link-personal-research" && ! "${TARGET_BRANCH}" =~ ^sync-research-[0-9]{8}(-[a-z0-9-]+)?$ ]]; then
            echo "::error::Invalid target branch; only link-personal-research or sync-research-YYYYMMDD is allowed."
            exit 1
          fi
          [[ "$(git -C team branch --show-current)" == "${TARGET_BRANCH}" ]] || {
            echo "::error::Unexpected target branch"; exit 1;
          }
          [[ -z "$(git -C team status --porcelain)" ]] || {
            echo "::error::Target checkout is dirty"; exit 1;
          }
          remote="$(git -C team remote get-url origin)"
          if [[ "${remote}" != "https://github.com/cslab-nituc/procon2026" && "${remote}" != "https://github.com/cslab-nituc/procon2026.git" ]]; then
            echo "::error::Unexpected destination remote"; exit 1;
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "tree=${tree}" >> "${GITHUB_OUTPUT}"
          echo "head=${head}" >> "${GITHUB_OUTPUT}"
          echo "Source commit: ${sha}"
          echo "Tracked files: $(git -C source ls-tree -r --name-only HEAD | wc -l)"

      - name: Create or update squashed subtree
        id: subtree
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.sha }}
          SOURCE_TREE: ${{ steps.preflight.outputs.tree }}
          START_HEAD: ${{ steps.preflight.outputs.head }}
        run: |
          set -euo pipefail
          prefix="research/procon-2026"
          git -C team config user.name 'github-actions[bot]'
          git -C team config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          subtree_status=0
          subtree_help="$(git -C team subtree -h 2>&1)" || subtree_status=$?
          if [[ "$subtree_status" -ne 0 && "$subtree_status" -ne 129 ]] || [[ "$subtree_help" != usage:*git\ subtree* ]]; then
            echo "::error::git subtree is unavailable"; exit 1;
          fi
          if git -C team cat-file -e "HEAD:${prefix}" 2>/dev/null; then
            if ! git -C team log HEAD -1 --format=%B --grep="git-subtree-dir: ${prefix}" | grep -Fq "git-subtree-dir: ${prefix}"; then
              echo "::error::Subtree directory exists without Subtree metadata"; exit 1;
            fi
            if [[ "$(git -C team rev-parse "HEAD:${prefix}")" == "${SOURCE_TREE}" ]]; then
              echo "The subtree already matches the current source tree"
              echo 'changed=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            git -C team subtree pull --prefix="${prefix}" --squash ../source "${SOURCE_SHA}"
          else
            git -C team fetch --no-tags ../source "${SOURCE_SHA}"
            git -C team subtree add --prefix="${prefix}" --squash "${SOURCE_SHA}"
          fi
          [[ "$(git -C team rev-parse "HEAD:${prefix}")" == "${SOURCE_TREE}" ]] || {
            echo "::error::Subtree tree does not exactly match source"; exit 1;
          }
          [[ "$(git -C team rev-parse HEAD:Cargo.toml)" == "$(git -C team rev-parse "${START_HEAD}:Cargo.toml")" ]] || {
            echo "::error::Team root Cargo.toml was modified"; exit 1;
          }
          outside="$(git -C team diff --name-only "${START_HEAD}" HEAD | grep -v '^research/procon-2026/' || true)"
          [[ -z "${outside}" ]] || {
            echo "::error::Subtree modified paths outside research/procon-2026"; printf '%s\n' "${outside}"; exit 1;
          }
          if ! git -C team log HEAD -1 --format=%B --grep="git-subtree-dir: ${prefix}" | grep -Fq "git-subtree-dir: ${prefix}"; then
            echo "::error::Subtree metadata missing"; exit 1;
          fi
          [[ -z "$(git -C team status --porcelain)" ]] || {
            echo "::error::Subtree checkout is dirty"; exit 1;
          }
          echo 'changed=true' >> "${GITHUB_OUTPUT}"

      - name: Push only to existing PR branch (no force)
        if: steps.subtree.outputs.changed == 'true'
        env:
          EXPECTED_TARGET_HEAD: ${{ steps.preflight.outputs.head }}
          TARGET_BRANCH: ${{ inputs.team_branch }}
        run: |
          set -euo pipefail
          remote_head="$(git -C team ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          [[ "${remote_head}" == "${EXPECTED_TARGET_HEAD}" ]] || {
            echo "::error::PR branch changed during sync; retry after review"; exit 1;
          }
          git -C team push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Summarize
        if: always()
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.sha }}
          CHANGED: ${{ steps.subtree.outputs.changed }}
          TARGET_BRANCH: ${{ inputs.team_branch }}
        run: |
          {
            echo "## Research subtree sync"
            echo "Source main SHA: ${SOURCE_SHA}"
            echo "Subtree updated: ${CHANGED}"
            echo "Team branch: ${TARGET_BRANCH}"
            echo "Bootstrap PR: https://github.com/cslab-nituc/procon2026/pull/26 (for link-personal-research only)"
            echo "No team branch was merged by this workflow."
          } >> "${GITHUB_STEP_SUMMARY}"
