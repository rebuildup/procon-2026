tag_resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'enhancement'
      - 'feature'
  default: patch
  groups:
    - title: Breaking Changes
        labels:
          - 'breaking'
    - title: Features
        labels:
          - 'feature'
          - 'enhancement'
    - title: Bug Fixes
        labels:
          - 'bug'
          - 'fix'
    - title: Maintenance
        labels:
          - 'chore'
          - 'dependencies'
          - 'ci'
    - title: Docs
        labels:
          - 'docs'
change_template: '- $title (#$number) @$author'
exclude_labels:
  - 'skip-changelog'